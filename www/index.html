document.querySelector('#start').onclick=()=>{document.querySelector('.hud').style.display='block';camera.position.set(0,1.65,8);yaw=0;pitch=0;camera.rotation.set(0,0,0,'YXZ');active=true;playSound('ambience',true,.34);document.querySelector('#overlay').style.display='none';say('NIVEL 0 · ENTRADA');setTimeout(()=>document.querySelector('#hint').style.display='none',7000)};document.querySelector('#continue').onclick=()=>{document.querySelector('#start').click()};document.querySelector('#options').onclick=()=>say('OPCIONES: audio de ambiente activo');document.querySelector('#credits').onclick=()=>say('RAT RIG · FERRIS WHEEL · CC BY 4.0');
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(active){nightSeconds+=dt;battery=Math.max(0,battery-dt*(.035+(lightOn ? .28 : 0)+(doorClosed ? .12 : 0)));document.querySelector('#battery').textContent=Math.floor(battery);let mins=Math.min(6,Math.floor(nightSeconds/55));document.querySelector('#clock').textContent=`${String((12+mins)%12||12).padStart(2,'0')}:00`;
if(!cameraMode&&!hidden){const oldX=camera.position.x,oldZ=camera.position.z;const stickMagnitude=Math.hypot(move.x,move.y)||1,stickLen=Math.min(1,Math.hypot(move.x,move.y)),mx=move.x/stickMagnitude*stickLen,my=move.y/stickMagnitude*stickLen;const dx=(Math.sin(yaw))*my*2.8*dt+(Math.cos(yaw))*mx*2.8*dt;const dz=(Math.cos(yaw))*my*2.8*dt-(Math.sin(yaw))*mx*2.8*dt;const blockers=[...wallBounds,...roomBlockers];if(robotRoot){const ex=enemy.position.x,ez=enemy.position.z;blockers.push([ex-.58,ex+.58,ez-.48,ez+.48])}const radius=.38;function blockedAt(px,pz){return blockers.some(b=>px>b[0]-radius&&px<b[1]+radius&&pz>b[2]-radius&&pz<b[3]+radius)}const nx=THREE.MathUtils.clamp(oldX+dx,-25.4,25.4);if(!blockedAt(nx,oldZ))camera.position.x=nx;const nz=THREE.MathUtils.clamp(oldZ+dz,-25.4,25.4);if(!blockedAt(camera.position.x,nz))camera.position.z=nz;camera.position.y=1.65;if(Math.abs(move.x)+Math.abs(move.y)>.35&&now-lastFoot>560){lastFoot=now;playSound('chains',false,.16)}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}

enemyDanger+=dt*(.004+(nightSeconds>40?.005:0));if(lightOn)enemyDanger-=dt*.055;if(hidden)enemyDanger-=dt*.02;enemyDanger=THREE.MathUtils.clamp(enemyDanger,0,1);if(enemyDanger>.25){if(enemyDanger>.72&&Math.random()<dt*.12)playSound('creature',false,.32);const t=THREE.MathUtils.clamp((enemyDanger-.25)/.75,0,1);const route=[[0,-4],[0,-7],[0,-10],[4,-10],[8,-10],[8,-14],[4,-14],[0,-14]];const q=t*(route.length-1),ri=Math.min(route.length-2,Math.floor(q)),u=q-ri;enemy.position.x=THREE.MathUtils.lerp(route[ri][0],route[ri+1][0],u)+Math.sin(nightSeconds*1.7)*.12;enemy.position.z=THREE.MathUtils.lerp(route[ri][1],route[ri+1][1],u);if(enemyDanger>.96&&!hidden){enemyDanger=.15;enemy.position.set(0,0,-4);say('¡SE OYEN PASOS EN EL LABERINTO!')}}}
for(const f of fixtures){const flick=Math.sin(now*.001+f.phase)>0.999?.15:1;f.light.visible=flick>.5}if(robotMixer)robotMixer.update(dt);if(enemy.visible){enemy.rotation.y=Math.sin(now*.001)*.04;enemy.position.y=Math.sin(now*.002)*.025}if(robotRoot){robotRoot.position.x=enemy.position.x;robotRoot.position.z=enemy.position.z-.5;robotRoot.visible=true;robotRoot.frustumCulled=false;const nextAnim=enemyDanger>.34?(robotActions.run?'run':'walk'):'idle';if(robotActions[nextAnim]&&robotRoot.userData.currentAnim!==nextAnim){for(const a of Object.values(robotActions))a.fadeOut(.16);robotActions[nextAnim].reset().setLoop(THREE.LoopRepeat,Infinity).fadeIn(.2).play();robotRoot.userData.currentAnim=nextAnim}}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});})();
